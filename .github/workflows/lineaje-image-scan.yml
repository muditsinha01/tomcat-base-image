name: Lineaje Image Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan"
        required: true
        default: "main"
      version:
        description: "Image version"
        required: true
        default: "10.1.53"

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # 1. Build the original image
      - name: Build original image
        run: docker build -t tomcat:${{ github.event.inputs.version }} .

      # 2. Scan + fix plan
      - name: Lineaje scan + fix plan
        id: scan
        uses: lineaje-actions/lineaje-actions@v1
        with:
          scan_type: image
          image: tomcat:${{ github.event.inputs.version }}
          metafiles: Dockerfile
          lineaje_cli_token: ${{ secrets.LINEAJE_CLI_TOKEN }}
          project_name: "tomcat"
          project_version: ${{ github.event.inputs.version }}
          org_name: "Root Organization"
          post_scan: fix_plan

      # 3. Rebuild when curated fixes are available
      - name: Build patched image
        if: steps.scan.outputs.premium_only == 'false' && steps.scan.outputs.fix_artifact_uploaded == 'true'
        run: |
          docker build \
            -f ${{ steps.scan.outputs.patched_dockerfile }} \
            -t tomcat:${{ github.event.inputs.version }}-patched \
            .

      # 4. Rescan the patched image
      - name: Lineaje rescan (patched)
        if: steps.scan.outputs.premium_only == 'false' && steps.scan.outputs.fix_artifact_uploaded == 'true'
        uses: lineaje-actions/lineaje-actions@v1
        with:
          scan_type: image
          image: tomcat:${{ github.event.inputs.version }}-patched
          metafiles: Dockerfile
          lineaje_cli_token: ${{ secrets.LINEAJE_CLI_TOKEN }}
          project_name: "tomcat"
          project_version: "${{ github.event.inputs.version }}-patched"
          org_name: "Root Organization"
          post_scan: scan_only
